name: Release

# Publisher half of the release flow. scripts/release.sh PREPARES a release
# (computes the version, writes VERSION + the categorized CHANGELOG entry,
# commits); this workflow PUBLISHES it when that commit reaches main: it
# creates the tag and the GitHub release, taking the notes from the
# CHANGELOG entry rather than re-deriving them — the categorization logic
# exists only in release.sh, so the two halves cannot drift.
#
# Because the tag is created here, on the commit that already contains the
# VERSION/CHANGELOG bump, the tagged tree always matches its version —
# the old flow tagged before committing and every tag carried the previous
# release's VERSION file.

on:
  push:
    paths:
      - 'VERSION'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          # Ensure version starts with 'v'
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.version }}" >/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.version }} already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.version.outputs.version }} does not exist, will create release"
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Take the first "## <version>" entry from CHANGELOG.md. Fail the
          # release when it doesn't match VERSION — that means release.sh was
          # not run (or someone bumped VERSION by hand), and publishing
          # unreviewed auto-notes would hide the mistake.
          python3 - "$VERSION" > /tmp/release-notes.md <<'PYEOF'
          import re, sys, pathlib
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(r"(?ms)^## (\S+)\n(.*?)(?=^## |\Z)", text)
          if not m:
              sys.stderr.write("::error::CHANGELOG.md has no release entries\n")
              raise SystemExit(1)
          entry_version, body = m.group(1), m.group(2).strip()
          if entry_version != version:
              sys.stderr.write(
                  f"::error::CHANGELOG's latest entry is {entry_version} but VERSION is "
                  f"{version}. Run scripts/release.sh instead of editing VERSION by hand.\n")
              raise SystemExit(1)
          print(f"## tGD {version}\n")
          print(body)
          PYEOF

          if [ -n "$PREV_TAG" ]; then
            echo "" >> /tmp/release-notes.md
            echo "---" >> /tmp/release-notes.md
            echo "**Full Changelog**: https://github.com/openclawyhwang-hub/tGD/compare/${PREV_TAG}...${VERSION}" >> /tmp/release-notes.md
          fi

          echo "Release notes:"
          cat /tmp/release-notes.md

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          gh release create "$VERSION" \
            --title "tGD $VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest

          echo "✅ Release $VERSION created successfully!"
