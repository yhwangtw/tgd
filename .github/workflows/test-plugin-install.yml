name: Test Plugin Installation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-skills:
    name: Validate skill content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate all skills
        run: node scripts/validate-skills.js

      - name: Validate lifecycle contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  validate:
    name: Validate plugin structure
    needs: validate-skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  test-install:
    name: Test plugin installation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Add marketplace
        run: claude plugin marketplace add ./

      - name: List marketplaces
        run: claude plugin marketplace list

      - name: Install plugin
        run: claude plugin install tGD@addy-tGD --scope user

  test-setup:
    name: Test setup.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Prepare isolated HOME and fake agent CLIs
        run: |
          mkdir -p "$TEST_HOME" "$RUNNER_TEMP/tgd-fake-bin"
          for tool in claude codex gemini opencode pi hermes codegraph; do
            printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/tgd-fake-bin/$tool"
            chmod +x "$RUNNER_TEMP/tgd-fake-bin/$tool"
          done
          echo "$RUNNER_TEMP/tgd-fake-bin" >> "$GITHUB_PATH"
        env:
          TEST_HOME: ${{ runner.temp }}/tgd-test-home

      - name: Run installer lifecycle contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run setup.sh twice
        run: |
          bash setup.sh --no-deps
          bash setup.sh --no-deps
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
        env:
          CI: "true"
          HOME: ${{ runner.temp }}/tgd-test-home

      - name: Verify exact managed links and hooks
        run: |
          while IFS='|' read -r link target; do
            test -L "$link"
            test "$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$link")" = "$target"
          done <<EOF
          $HOME/.codex/skills/tGD|$GITHUB_WORKSPACE/skills
          $HOME/.config/opencode/skills/tGD|$GITHUB_WORKSPACE/skills
          $HOME/.gemini/skills/tGD|$GITHUB_WORKSPACE/skills
          $HOME/.pi/agent/skills/tGD|$GITHUB_WORKSPACE/skills
          $HOME/.hermes/skills/tgd-rules|$GITHUB_WORKSPACE/skills/tgd-rules
          $HOME/.local/bin/tgd|$GITHUB_WORKSPACE/bin/tgd
          EOF
          for config in \
            "$HOME/.claude/settings.json" \
            "$HOME/.codex/hooks.json" \
            "$HOME/.gemini/settings.json"; do
            python3 -m json.tool "$config" >/dev/null
          done
          grep -Fq "$GITHUB_WORKSPACE/hooks/session-start.sh" "$HOME/.claude/settings.json"
          grep -Fq "$GITHUB_WORKSPACE/hooks/codex/session-start.sh" "$HOME/.codex/hooks.json"
          grep -Fq "$GITHUB_WORKSPACE/hooks/gemini/session-start.sh" "$HOME/.gemini/settings.json"
        env:
          HOME: ${{ runner.temp }}/tgd-test-home

      - name: Verify safe uninstall round trip
        run: |
          bash setup.sh --uninstall
          test -f VERSION
          for path in \
            "$HOME/.local/bin/tgd" \
            "$HOME/.codex/skills/tGD" \
            "$HOME/.config/opencode/skills/tGD" \
            "$HOME/.gemini/skills/tGD" \
            "$HOME/.pi/agent/skills/tGD"; do
            test ! -e "$path"
            test ! -L "$path"
          done
          test ! -e "$HOME/.tgd/install-manifest.json"
          test ! -e "$HOME/.tgd-installed-version"
          ! grep -Fq "$GITHUB_WORKSPACE/hooks/session-start.sh" "$HOME/.claude/settings.json"
          ! grep -Fq "$GITHUB_WORKSPACE/hooks/codex/session-start.sh" "$HOME/.codex/hooks.json"
          ! grep -Fq "$GITHUB_WORKSPACE/hooks/gemini/session-start.sh" "$HOME/.gemini/settings.json"
        env:
          CI: "true"
          HOME: ${{ runner.temp }}/tgd-test-home
