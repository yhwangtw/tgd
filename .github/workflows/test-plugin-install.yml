name: Test Plugin Installation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-skills:
    name: Validate skill content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate all skills
        run: node scripts/validate-skills.js

      - name: Validate lifecycle contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  validate:
    name: Validate plugin structure
    needs: validate-skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  test-install:
    name: Test plugin installation
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Add marketplace
        run: claude plugin marketplace add ./

      - name: List marketplaces
        run: claude plugin marketplace list

      - name: Install plugin
        run: claude plugin install tGD@addy-tGD --scope user

  test-setup:
    name: Test setup.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Prepare isolated HOME and fake agent CLIs
        run: |
          mkdir -p "$TEST_HOME" "$RUNNER_TEMP/tgd-fake-bin"
          for tool in claude codex gemini opencode pi hermes codegraph; do
            printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/tgd-fake-bin/$tool"
            chmod +x "$RUNNER_TEMP/tgd-fake-bin/$tool"
          done
          echo "$RUNNER_TEMP/tgd-fake-bin" >> "$GITHUB_PATH"
          python3 - "$TEST_HOME" <<'PY'
          import json
          from pathlib import Path
          import sys

          home = Path(sys.argv[1])
          destinations = {
              "claude": home / ".claude" / "settings.json",
              "codex": home / ".codex" / "hooks.json",
              "gemini": home / ".gemini" / "settings.json",
          }
          for platform, destination in destinations.items():
              destination.parent.mkdir(parents=True, exist_ok=True)
              config = {
                  "ciForeignSentinel": "preserve-{}".format(platform),
                  "hooks": {
                      "SessionStart": [
                          {
                              "matcher": "foreign-{}".format(platform),
                              "hooks": [
                                  {
                                      "type": "command",
                                      "command": (
                                          "bash /opt/ci-foreign/{}.sh".format(platform)
                                      ),
                                  }
                              ],
                          }
                      ]
                  },
              }
              destination.write_text(
                  json.dumps(config, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY
        env:
          TEST_HOME: ${{ runner.temp }}/tgd-test-home

      - name: Run installer lifecycle contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run setup.sh twice
        run: |
          bash setup.sh --no-deps
          bash setup.sh --no-deps
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
        env:
          CI: "true"
          HOME: ${{ runner.temp }}/tgd-test-home

      - name: Verify exact managed on-demand links
        run: |
          while IFS='|' read -r link target; do
            test -L "$link"
            test -e "$link"
            test -e "$target"
            test "$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$link")" = "$target"
          done <<EOF
          $HOME/.pi/agent/skills/tGD|$GITHUB_WORKSPACE/skills
          $HOME/.hermes/skills/tgd-rules|$GITHUB_WORKSPACE/skills/tgd-rules
          $HOME/.understand-anything-plugin|$GITHUB_WORKSPACE/vendor/understand-anything/understand-anything-plugin
          $HOME/.local/bin/tgd|$GITHUB_WORKSPACE/bin/tgd
          EOF
          for target in "$GITHUB_WORKSPACE"/skills/*; do
            for link in \
              "$HOME/.gemini/skills/$(basename "$target")" \
              "$HOME/.config/opencode/skills/$(basename "$target")" \
              "$HOME/.agents/skills/$(basename "$target")"; do
              test -L "$link"
              test -e "$link"
              test "$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$link")" = "$target"
            done
          done
          for target in "$GITHUB_WORKSPACE"/.codex/skills/*; do
            link="$HOME/.agents/skills/$(basename "$target")"
            test -L "$link"
            test -e "$link"
            test "$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$link")" = "$target"
          done
          for target in "$GITHUB_WORKSPACE"/vendor/understand-anything/understand-anything-plugin/skills/*; do
            link="$HOME/.agents/skills/$(basename "$target")"
            test -L "$link"
            test -e "$link"
            test "$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$link")" = "$target"
            gemini_fallback="$HOME/.gemini/skills/$(basename "$target")"
            test ! -e "$gemini_fallback"
            test ! -L "$gemini_fallback"
          done
          test "$("$HOME/.local/bin/tgd" --version)" = "tGD $(cat VERSION)"
          python3 - "$HOME" "$GITHUB_WORKSPACE" <<'PY'
          import json
          from pathlib import Path
          import sys

          home = Path(sys.argv[1])
          repo = Path(sys.argv[2]).resolve()
          specs = {
              "claude": (
                  home / ".claude" / "settings.json",
                  repo / "hooks" / "session-start.sh",
              ),
              "codex": (
                  home / ".codex" / "hooks.json",
                  repo / "hooks" / "codex" / "session-start.sh",
              ),
              "gemini": (
                  home / ".gemini" / "settings.json",
                  repo / "hooks" / "gemini" / "session-start.sh",
              ),
          }

          for platform, (destination, script) in specs.items():
              config = json.loads(destination.read_text(encoding="utf-8"))
              if config.get("ciForeignSentinel") != "preserve-{}".format(platform):
                  raise SystemExit("{} config sentinel was not preserved".format(platform))
              entries = config.get("hooks", {}).get("SessionStart")
              if not isinstance(entries, list):
                  raise SystemExit("{} foreign SessionStart hooks are missing".format(platform))
              foreign_command = "bash /opt/ci-foreign/{}.sh".format(platform)
              commands = [
                  hook.get("command")
                  for entry in entries
                  if isinstance(entry, dict)
                  for hook in entry.get("hooks", [])
                  if isinstance(hook, dict)
              ]
              if commands.count(foreign_command) != 1:
                  raise SystemExit(
                      "{} foreign SessionStart hook was not preserved".format(platform)
                  )
              if any(str(script) in str(command) for command in commands):
                  raise SystemExit(
                      "{} tGD hook was installed by plain setup".format(platform)
                  )
          PY
          test ! -e "$HOME/.tgd/session-preamble.enabled"
          test ! -L "$HOME/.tgd/session-preamble.enabled"
          test ! -e "$HOME/.pi/agent/APPEND_SYSTEM.md"
          test ! -L "$HOME/.pi/agent/APPEND_SYSTEM.md"
        env:
          HOME: ${{ runner.temp }}/tgd-test-home

      - name: Verify opt-in session preamble round trip
        run: |
          bash setup.sh --with-session-preamble --no-deps
          bash setup.sh --with-session-preamble --no-deps
          test -L "$HOME/.tgd/session-preamble.enabled"
          test -L "$HOME/.pi/agent/APPEND_SYSTEM.md"
          python3 - "$HOME" "$GITHUB_WORKSPACE" <<'PY'
          import json
          from pathlib import Path
          import shlex
          import sys

          home = Path(sys.argv[1])
          repo = Path(sys.argv[2]).resolve()
          specs = {
              "claude": (
                  home / ".claude" / "settings.json",
                  repo / "hooks" / "session-start.sh",
              ),
              "codex": (
                  home / ".codex" / "hooks.json",
                  repo / "hooks" / "codex" / "session-start.sh",
              ),
              "gemini": (
                  home / ".gemini" / "settings.json",
                  repo / "hooks" / "gemini" / "session-start.sh",
              ),
          }

          def canonical_entry(platform, script):
              hook = {
                  "type": "command",
                  "command": "bash " + shlex.quote(str(script)),
              }
              entry = {"hooks": [hook]}
              if platform == "codex":
                  entry["matcher"] = "startup|resume|clear|compact"
                  hook["statusMessage"] = "Loading tGD session guidance"
              elif platform == "gemini":
                  hook["name"] = "tgd-session-start"
              return entry

          for platform, (destination, script) in specs.items():
              config = json.loads(destination.read_text(encoding="utf-8"))
              entries = config.get("hooks", {}).get("SessionStart", [])
              expected = canonical_entry(platform, script)
              if entries.count(expected) != 1:
                  raise SystemExit(
                      "{} canonical SessionStart hook count is not one".format(platform)
                  )
          PY
          bash setup.sh --no-deps
          test ! -e "$HOME/.tgd/session-preamble.enabled"
          test ! -L "$HOME/.tgd/session-preamble.enabled"
          test ! -e "$HOME/.pi/agent/APPEND_SYSTEM.md"
          test ! -L "$HOME/.pi/agent/APPEND_SYSTEM.md"
          python3 - "$HOME" "$GITHUB_WORKSPACE" <<'PY'
          import json
          from pathlib import Path
          import sys

          home = Path(sys.argv[1])
          repo = Path(sys.argv[2]).resolve()
          specs = {
              "claude": (
                  home / ".claude" / "settings.json",
                  repo / "hooks" / "session-start.sh",
              ),
              "codex": (
                  home / ".codex" / "hooks.json",
                  repo / "hooks" / "codex" / "session-start.sh",
              ),
              "gemini": (
                  home / ".gemini" / "settings.json",
                  repo / "hooks" / "gemini" / "session-start.sh",
              ),
          }
          for platform, (destination, script) in specs.items():
              config = json.loads(destination.read_text(encoding="utf-8"))
              if config.get("ciForeignSentinel") != "preserve-{}".format(platform):
                  raise SystemExit("{} config sentinel was not preserved".format(platform))
              entries = config.get("hooks", {}).get("SessionStart", [])
              commands = [
                  hook.get("command")
                  for entry in entries
                  if isinstance(entry, dict)
                  for hook in entry.get("hooks", [])
                  if isinstance(hook, dict)
              ]
              foreign = "bash /opt/ci-foreign/{}.sh".format(platform)
              if commands.count(foreign) != 1:
                  raise SystemExit("{} foreign hook was not preserved".format(platform))
              if any(str(script) in str(command) for command in commands):
                  raise SystemExit("{} tGD hook survived plain setup".format(platform))
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
        env:
          CI: "true"
          HOME: ${{ runner.temp }}/tgd-test-home

      - name: Verify safe uninstall round trip
        run: |
          bash setup.sh --uninstall
          test -f VERSION
          for path in \
            "$HOME/.local/bin/tgd" \
            "$HOME/.pi/agent/skills/tGD" \
            "$HOME/.hermes/skills/tgd-rules" \
            "$HOME/.understand-anything-plugin"; do
            test ! -e "$path"
            test ! -L "$path"
          done
          for target in "$GITHUB_WORKSPACE"/skills/*; do
            for path in \
              "$HOME/.gemini/skills/$(basename "$target")" \
              "$HOME/.config/opencode/skills/$(basename "$target")" \
              "$HOME/.agents/skills/$(basename "$target")"; do
              test ! -e "$path"
              test ! -L "$path"
            done
          done
          for target in "$GITHUB_WORKSPACE"/.codex/skills/*; do
            path="$HOME/.agents/skills/$(basename "$target")"
            test ! -e "$path"
            test ! -L "$path"
          done
          for target in "$GITHUB_WORKSPACE"/vendor/understand-anything/understand-anything-plugin/skills/*; do
            for path in \
              "$HOME/.agents/skills/$(basename "$target")" \
              "$HOME/.gemini/skills/$(basename "$target")"; do
              test ! -e "$path"
              test ! -L "$path"
            done
          done
          test ! -e "$HOME/.tgd/install-manifest.json"
          test ! -e "$HOME/.tgd/hook-ownership.json"
          test ! -e "$HOME/.tgd-installed-version"
          python3 - "$HOME" "$GITHUB_WORKSPACE" <<'PY'
          import json
          from pathlib import Path
          import shlex
          import sys

          home = Path(sys.argv[1])
          repo = Path(sys.argv[2]).resolve()
          specs = {
              "claude": (
                  home / ".claude" / "settings.json",
                  repo / "hooks" / "session-start.sh",
              ),
              "codex": (
                  home / ".codex" / "hooks.json",
                  repo / "hooks" / "codex" / "session-start.sh",
              ),
              "gemini": (
                  home / ".gemini" / "settings.json",
                  repo / "hooks" / "gemini" / "session-start.sh",
              ),
          }
          for platform, (destination, script) in specs.items():
              if not destination.is_file():
                  raise SystemExit("{} config was removed".format(platform))
              config = json.loads(destination.read_text(encoding="utf-8"))
              if config.get("ciForeignSentinel") != "preserve-{}".format(platform):
                  raise SystemExit("{} config sentinel was not preserved".format(platform))
              entries = config.get("hooks", {}).get("SessionStart")
              if not isinstance(entries, list):
                  raise SystemExit("{} foreign SessionStart hooks are missing".format(platform))
              foreign_command = "bash /opt/ci-foreign/{}.sh".format(platform)
              commands = [
                  hook.get("command")
                  for entry in entries
                  if isinstance(entry, dict)
                  for hook in entry.get("hooks", [])
                  if isinstance(hook, dict)
              ]
              if commands.count(foreign_command) != 1:
                  raise SystemExit(
                      "{} foreign SessionStart hook was not preserved".format(platform)
                  )
              expected_words = ["bash", str(script)]
              for command in commands:
                  if not isinstance(command, str):
                      continue
                  try:
                      words = shlex.split(command)
                  except ValueError:
                      continue
                  if words == expected_words:
                      raise SystemExit(
                          "{} canonical hook survived uninstall".format(platform)
                      )
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
        env:
          CI: "true"
          HOME: ${{ runner.temp }}/tgd-test-home
