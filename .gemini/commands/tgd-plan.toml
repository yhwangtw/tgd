description = "Plan — decompose specs into small, verifiable tasks with acceptance criteria"

prompt = """

## Pre-flight

- [ ] Resolve `$TGD_DIR` from its environment variable, then sibling `../<project-name>-tGD/`; require CONTEXT.md. If absent, STOP and run `/tgd-map`.
- [ ] Select `<feature-name>` from non-infrastructure subdirectories containing PRD.md or SPEC.md. None means STOP and run `/tgd-define`; multiple means ask the user. All work targets `$TGD_DIR`.
- [ ] `$TGD_DIR/<feature-name>/PRD.md` exists and `$TGD_DIR/<feature-name>/SPEC.md` exists, both non-empty. Otherwise STOP and run `/tgd-define`.
- [ ] Read PRD `## UI Design`. If the section is missing, STOP and resume `/tgd-define` to classify it in place. Mode 4 needs no DESIGN.md; modes 1–3 require `direction-approved`, DESIGN.md, `python3 "$TGD_REPO_ROOT/scripts/check-doc-sections.py" DESIGN "$TGD_DIR/<feature-name>/DESIGN.md"` exit 0, and `[x] **DESIGN**: Direction Approved`.

**If a required design artifact or direction approval is missing:** STOP. Tell user: "Design direction is incomplete. Resume `/tgd-define`; this is a role handoff inside Define, not a new lifecycle phase."

## Re-plan gate

**🔁 Re-plan check (BEFORE writing anything):** if `$TGD_DIR/<feature-name>/TASKS.md` already exists, do NOT regenerate it from scratch — `/tgd-develop` backfills `Test:` fields and flips `**Status:**` lines in it, and a fresh rewrite destroys them (breaking the `ac-trace` / regression chain).

Count tasks, completed tasks, and backfilled Test fields, then ask:

```text
1. Update incrementally — preserve completed tasks and all Test fields; update only unfinished tasks affected by the spec
2. Start over — discard existing status and Test backfills

Choose one (default 1):
```

For incremental updates, **completed tasks are immutable**: any task with `**Status:** complete` preserves its Status, criteria, Test fields, and existing AC ids; **never renumber existing `AC-<task>.<n>` ids**. Continue numbering new tasks and only rewrite invalidated unstarted tasks. Preserve Jira-Source-ID plus every Jira/Jira-Sync-ID value byte-for-byte. A new plan creates one lowercase UUID-v4 source id; a legacy plan missing it adds one once. Preserve a standalone legacy heading Jira key; only the Jira CLI may remove it after verified adoption, and it must never be copied manually into Jira fields.

## Build TASKS.md

Read CONTEXT.md, PRD.md, SPEC.md, and—for UI modes 1–3—DESIGN.md plus the real UI sources it identifies. Run `tgd-plan-breakdown` and write `$TGD_DIR/<feature-name>/TASKS.md` using its canonical schema. Order small, isolated tasks by dependency.

- Multi-repo: prefix every task heading with `[repo-name]`.
- UI: derive tasks and observable-state, viewport, keyboard/focus, and approved-deviation ACs from DESIGN.md; cite the relevant DESIGN heading.
- If PRD §6 names a new event, use `tgd-plan-breakdown`'s event schema to add it to cumulative TRACKING-PLAN.md as `planned`, and add one instrumentation task per platform. A server source of truth is implemented once.
- **Every criterion has an explicit `[R]` Yes/No regression decision.**

## Jira Integration Gate

Run this immediately after TASKS.md is written. **Never write automatically.** Ask via Selection Protocol even when Jira environment variables are already configured:

```text
📋 TASKS.md is ready (N tasks).
🔗 Preview Jira synchronization?
1. Preview (read-only; creates, updates, and writes back nothing)
2. Skip

Choose one (default 2):
```

Choice 1 loads `tgd-plan-jira` and uses only `scripts/jira-sync.py`; that skill owns commands, schemas, reconciliation, and result interpretation. Keep these command-level boundaries:

- Credentials come only from process `JIRA_URL`/`JIRA_TOKEN`; never request, log, pass, or persist a PAT. Missing values STOP until exported externally.
- List every returned Project key/name and require an exact user choice; `JIRA_PROJECT` is only a hint.
- Discover every **non-automatic required field** for that exact Project/type and ask without guessing. Sprint is ordinary required-field metadata. Store answers only in a new private mode-0600 JSON file.
- Produce a GET-only **dry-run** for current TASKS.md and chosen Project, showing answers, actions, and digest. It must not mutate Jira or TASKS.md. A conflict shows candidate keys and stops; ambiguous adoption **must never fall through to `create`**.
- Only after a visible, conflict-free plan ask:

  ```text
  Apply the Jira plan above?
  1. Apply to <PROJECT_KEY> (digest: <SHA-256>)
  2. Cancel

  Choose one (default 2):
  ```

- Only choice 1 authorizes mutation. A **stale digest**, changed TASKS.md/Project/inputs, or missing confirmation aborts. Apply must remotely verify every issue/required field before atomic identity writeback. Any conflicts, unknown remote result, failure, pending writeback, or abort blocks the handoff and requires reconciliation. Do not claim exactly-once behavior across concurrent clients.
- Choice 2 at either prompt makes **no Jira or TASKS.md** sync changes and continues. Skipping is not Plan failure; new unsynced tasks remain `—`.

## Verification Gate

- [ ] TASKS.md exists, is non-empty, and `python3 "$TGD_REPO_ROOT/scripts/check-doc-sections.py" TASKS "$TGD_DIR/<feature-name>/TASKS.md"` exits 0.
- [ ] Re-plan preservation holds: completed tasks/Test fields and existing AC/Jira identities are unchanged.
- [ ] Exactly one lowercase UUID-v4 Jira-Source-ID exists; every task has Jira and Jira-Sync-ID fields, with `—` when unsynced.
- [ ] Every BDD criterion has stable `AC-<task>.<n>` and `[R]` decision; `grep -qE 'AC-[0-9]+[.][0-9]+' TASKS.md` succeeds.
- [ ] UI tasks and ACs trace the approved DESIGN; new tracking events have planned entries and instrumentation ACs.

End with the closing report per `tgd-core-rules` → **Command Closing Report**: 📦 Output (TASKS.md — N tasks, M acceptance criteria; Jira `verified writeback keys` / `cancelled` / `skipped` / `incomplete: <result keys + issue keys>`) · 🔎 Checks (gate as one line) · ➡️ Next shows `/tgd-develop` only after conflict-free success/cancel/skip; when Jira is incomplete, say to reconcile and re-run the dry-run without claiming the Plan gate passed. Don't paste the raw checklist above.
"""
