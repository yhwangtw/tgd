description = "Review before merge — improve code health"

prompt = """

## Pre-flight

- [ ] Resolve `$TGD_DIR` from its environment variable, then sibling `../<project-name>-tGD/`; require CONTEXT.md or STOP and run `/tgd-map`.
- [ ] Select `<feature-name>` from non-infrastructure subdirectories containing PRD.md or SPEC.md. None means STOP and run `/tgd-define`; multiple means ask. Require SPEC.md.
- [ ] Feature tests exist in the actual layout from CONTEXT.md and `$TGD_DIR/<feature-name>/TEST-REPORT.md` exists.
- [ ] When PRD UI mode is 1–3, DESIGN.md exists and TEST-REPORT has passing, SHA-bound UI evidence.

**If missing:** STOP. Report the specific missing artifact: test evidence returns to `/tgd-verify`; UI classification or direction returns to `/tgd-define`.

When `../project-<feature-name>` exists, **review the code inside that worktree** using `git diff main...feature/<feature-name>`. **Multi-repo features (TASKS.md has `[repo-name]` prefixes) have one worktree PER repo (`../project-<feature-name>-<repo-name>`) — review EACH repo's diff; a repo with tagged tasks but an unreviewed diff fails the gate.**

## Review pipeline

Run the `tgd-review-quality` skill. This is the REVIEW phase. The full pipeline is:

1. `tgd-review-quality` for the five-axis review with severity labels. If CodeGraph is available, check callers and affected files; otherwise trace with plain search.
2. `tgd-review-simplify` to reduce complexity while preserving exact behavior.

For a critical-path `[R]` criterion (auth, payment, data loss, security boundary), security-sensitive code, or a diff over roughly 300 lines, dispatch fresh-context code-reviewer, security-auditor, and test-engineer personas in parallel with only the diff and spec, then merge their reports into REVIEW.md sections 1–3. If delegation is unavailable, run the same three reviews inline. Follow `references/orchestration-patterns.md`; personas never invoke each other. Low-stakes work uses the main-session review. If the change is larger than roughly 100 lines, split it into smaller reviews.

Conditional routing:

- **Security concerns? → `tgd-review-security`**
- **Performance concerns? → `tgd-review-performance`**
- Large/unfamiliar diff → `understand-diff`.
- UI modes 1–3 → compare implementation and TEST-REPORT evidence with the approved direction.

Fix findings and simplify before sign-off.

## Outputs and re-test

After completing the review, create `$TGD_DIR/<feature-name>/REVIEW.md` using this template:

> Canonical template: `$TGD_REPO_ROOT/templates/REVIEW.md.tmpl`.

For UI modes 1–3, complete its `## Design Conformance (if UI)` section from
the approved direction and SHA-bound Verify evidence.

**🔁 Re-test after review changes:** if ANY code changed during this phase (finding fixes or simplification), **commit the changes on the feature branch first**, then re-run the capture in the affected worktree BEFORE sign-off — `bash "$TGD_REPO_ROOT/scripts/capture-test-output.sh" "$TGD_DIR/<feature-name>/TEST-REPORT.md"` (multi-repo: repo name as the 3rd arg).

For UI-affecting changes, also re-run Verify's Design Conformance Gate and replace UI evidence with the new SHA.

If any architectural decisions were made, create an ADR at `$TGD_DIR/<feature-name>/decisions/ADR-NNN-<decision>.md` using the **canonical ADR template in the `tgd-review-adr` skill** — it is the single source; do not hand-roll a different shape. That skill owns required fields and authoring method.

## Verification Gate

- [ ] **Code review feedback addressed — every 🔴 Critical row in the findings table reads `fixed`; 🟠 deferred rows carry a justification.**
- [ ] **No critical security or performance warnings remain.**
- [ ] Review changes were committed and their affected tests/evidence re-captured; every worktree is clean.
- [ ] REVIEW.md exists, is non-empty, and `python3 "$TGD_REPO_ROOT/scripts/check-doc-sections.py" REVIEW "$TGD_DIR/<feature-name>/REVIEW.md"` exits 0.
- [ ] UI modes 1–3 show `✅ Pass`, SHA-matched evidence, and `[x] **DESIGN**: Implementation Approved`.

End with the closing report per `tgd-core-rules` → **Command Closing Report**: 📦 Output (REVIEW.md — per-axis Pass/Warn/Fail summary; ADR when applicable) · 🔎 Checks (gate as one line) · ➡️ Next `/tgd-release` — deploy. Don't paste the raw checklist above.
"""
