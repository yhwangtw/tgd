version: 1
source_of_truth: templates/
format: markdown
artifacts:
  CONTEXT:
    file: CONTEXT.md.tmpl
    scope: project
    producer: tgd-map
  PRD:
    file: PRD.md.tmpl
    scope: feature
    producer: tgd-define
  SPEC:
    file: SPEC.md.tmpl
    scope: feature
    producer: tgd-define
  DESIGN:
    file: DESIGN.md.tmpl
    scope: feature
    producer: tgd-define
    conditional: UI modes 1-3
  TASKS:
    file: TASKS.md.tmpl
    scope: feature
    producer: tgd-plan
  TRACKING-PLAN:
    file: TRACKING-PLAN.md.tmpl
    scope: project
    producer: tgd-plan
    conditional: new PRD metric events
  TEST-REPORT:
    file: TEST-REPORT.md.tmpl
    scope: feature
    producer: tgd-verify
  REVIEW:
    file: REVIEW.md.tmpl
    scope: feature
    producer: tgd-review
  ADR:
    file: ADR.md.tmpl
    scope: feature-or-shared
    producer: tgd-review
    conditional: architectural decision
  CHANGELOG:
    file: CHANGELOG.md.tmpl
    scope: project
    producer: tgd-release
  METRICS:
    file: METRICS.md.tmpl
    scope: feature
    producer: tgd-release
    conditional: PRD §6 is not signed-off N/A
  REGRESSION-CATALOG:
    file: REGRESSION-CATALOG.md.tmpl
    scope: project
    producer: tgd-release
    conditional: TASKS contains [R] criteria
